name: Devcontainer CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # build the devcontainer from .devcontainer.json
      - name: Build and publish devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: docker.io/hacksore/dotfiles-devcontainer
          imageTag: latest
          cacheFrom: docker.io/hacksore/dotfiles-devcontainer
          runCmd: |
            echo all done 😊
          push: filter
          refFilterForPush: refs/heads/master
          eventFilterForPush: push
