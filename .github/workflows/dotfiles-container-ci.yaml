name: Dotfiles Container CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/hacksore/dotfiles-container

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .container/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=dotfiles-container-${{ matrix.arch }}
            type=gha,scope=dotfiles-container
          cache-to: type=gha,mode=max,scope=dotfiles-container-${{ matrix.arch }}
      - name: Smoke test runtime image
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "exe.dev/login-user" }}' "${IMAGE_TAG}")" = hacksore
          docker run --rm "${IMAGE_TAG}" /usr/bin/zsh -lc '
            set -e
            test "$(id -un)" = hacksore
            test "$HOME" = /home/hacksore
            test "$(getent passwd "$(id -un)" | cut -d: -f7)" = /usr/bin/zsh
            locale -a | grep -Fxq en_US.utf8
            test -L "$HOME/.zshrc"
            test -e "$HOME/.config/nvim/init.lua"
            command -v brew fnm node pnpm rustup rustc cargo go python ruby java deno nvim starship tmux
            node --version
            pnpm --version
            rustup toolchain list
          '
          docker run --rm --tty "${IMAGE_TAG}" /usr/bin/zsh -ic 'echo shell-config-ok'
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: hacksore
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish platform image by digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .container/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=dotfiles-container-${{ matrix.arch }}
            type=gha,scope=dotfiles-container
      - name: Export image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hacksore
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          SHA_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          sources=()
          for digest in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest}")")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${SHA_IMAGE}" \
            "${sources[@]}"
          docker buildx imagetools inspect --raw "${SHA_IMAGE}" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]
          '
