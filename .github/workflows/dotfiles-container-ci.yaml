name: Dotfiles Container CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/hacksore/dotfiles-container

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .container/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha,scope=dotfiles-container
          cache-to: type=gha,mode=max,scope=dotfiles-container
      - name: Smoke test runtime image
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "exe.dev/login-user" }}' "${IMAGE_NAME}:ci")" = hacksore
          docker run --rm "${IMAGE_NAME}:ci" /usr/bin/zsh -lc '
            set -e
            test "$(id -un)" = hacksore
            test "$HOME" = /home/hacksore
            test "$(getent passwd "$(id -un)" | cut -d: -f7)" = /usr/bin/zsh
            test -L "$HOME/.zshrc"
            test -e "$HOME/.config/nvim/init.lua"
            command -v brew fnm node pnpm rustup rustc cargo go python ruby java deno nvim starship tmux
            node --version
            pnpm --version
            rustup toolchain list
          '
          docker run --rm --tty "${IMAGE_NAME}:ci" /usr/bin/zsh -ic 'echo shell-config-ok'

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hacksore
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
      - name: Build and publish runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dotfiles-container
          cache-to: type=gha,mode=max,scope=dotfiles-container
